<div  class="card experiance p-5 mt-5 shadow">
  <h3 class="card-title">
    <fa-icon class="fa-1x mr-2" [icon]="brifecase"></fa-icon>
    Work experience
    <span class="align-items-around float-right">
      <fa-icon class="fa-0x mr-2" (click)="up('experiance')" [icon]="arrowup"></fa-icon>
      <fa-icon class="fa-0x mr-2" (click)="down('experiance')" [icon]="arrowdown"></fa-icon>
      <fa-icon class="fa-0x mr-2"  (click)="setting('experiance')" [icon]="gear"></fa-icon>
    </span>
  </h3>
  <hr>
<div *ngIf="exp.get('experiance1')"  [formGroup]="exp.get('experiance1')"> 
  <div class="row mt-3">
    <div class="col-md-6">
      <div class="form-group">
        <label for="country"> Job</label>
        <input type="text" class="form-control"  formControlName="jobTitle" id="job" placeholder="your country" />
      </div>
    </div>
    <div class="col-md-6">
      <div class="form-group">
        <label for="town"> City/Town</label>
        <input type="text" class="form-control"  formControlName="city"  id="town" placeholder="your town" />
      </div>
    </div>
  </div>
  <div class="row mt-3">
    <div class="col-md-12">
      <div class="form-group">
        <label for="employer"> Employer</label>
        <input type="text" class="form-control"  formControlName="employer" id="employer" placeholder="your employer" />
      </div>
    </div>
  </div>
  <div class="row mt-3">
    <div class="col-md-6">
      <div class="form-group">
        <label for="startdate"> Start Date</label>
        <div  formGroupName="startDate" class="d-flex flex-row ">
          <select  formControlName="month" class="custom-select col-6 mr-1">
            <option value=""> Select Month </option>
            <option> January </option>
            <option> February </option>
            <option> March </option>
            <option> April </option>
            <option> May </option>
            <option> June </option>
            <option> July </option>
            <option> August </option>
            <option> September </option>
            <option> October </option>
            <option> November </option>
            <option> December </option>
          </select>

          <select  formControlName="year" class="custom-select col-6">
            <option value=""> Select Year </option>
            <option *ngFor="let year of years" [value]="year"> {{year}} </option>
          </select>

        </div>
        <div *ngIf="exp.get('experiance1.startDate.month').invalid && exp.get('experiance1.startDate.month').touched" class="text-danger small">
          Month is required
        </div>
        <div *ngIf="exp.get('experiance1.startDate.year').invalid && exp.get('experiance1.startDate.year').touched" class="text-danger small">
          Year is required
        </div>

      </div>
    </div>
    <div class="col-md-6">
      <div class="form-group">
        <label for="enddate"> End Date</label>
        <div  formGroupName="endDate" class="d-flex flex-row">
          <select  formControlName="month" class="custom-select col-6 mr-1">
            <option value=""> Select Month </option>
            <option> January </option>
            <option> February </option>
            <option> March </option>
            <option> April </option>
            <option> May </option>
            <option> June </option>
            <option> July </option>
            <option> August </option>
            <option> September </option>
            <option> October </option>
            <option> November </option>
            <option> December </option>
          </select>

          <select  formControlName="year" class="custom-select col-6 ">
            <option value=""> Select Year </option>
            <option *ngFor="let year of years" [value]="year"> {{year}} </option>
          </select>

        </div>
        <div *ngIf="exp.get('experiance1.endDate.month').invalid && exp.get('experiance1.endDate.month').touched" class="text-danger small">
          Month is required
        </div>
        <div *ngIf="exp.get('experiance1.endDate.year').invalid && exp.get('experiance1.endDate.year').touched" class="text-danger small">
          Year is required
        </div>
      </div>
    </div>
  </div>
  <div class="row mt-3">
    <div class="col-md-12">
      <div class="form-group">
        <label for="description"> Description</label>
        <div class="list-group" #description >
          <div class="list-group-item p-0">
            
            <quill-editor  [styles]="{height: '140px'}" class="textarea" formControlName="description"
             placeholder="Enter Text"
             ></quill-editor>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="row mt-3">
    <div class="col-md-12">
      <div class="form-group">

        <!-- <div class="float-right btn ml-5 btn-outline-dark btn-md">
            <fa-icon class="fa-1x mr-2" [icon]="save"></fa-icon> Save
          </div> -->

        <!-- <div class="float-right btn btn-outline-dark btn-md">
            <fa-icon class="fa-1x mr-2" [icon]="delete"></fa-icon> Delete
          </div> -->
      </div>
    </div>
  </div>

</div>
