name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '12.x'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install --force

      - name: Patch sass-loader for Dart Sass
        run: |
          # Patch sass-loader to prefer sass over node-sass
          sed -i "s/let sassImplPkg = 'node-sass';/let sassImplPkg = 'sass';/" node_modules/sass-loader/dist/index.js
          sed -i "s/require.resolve('node-sass');/require.resolve('sass');/" node_modules/sass-loader/dist/index.js
          sed -i "s/require.resolve('sass');/require.resolve('node-sass');/" node_modules/sass-loader/dist/index.js

      - name: Build Angular app
        run: |
          npm run build -- --base-href="/${{ github.event.repository.name }}/" --prod
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Create 404.html for SPA routing
        run: |
          cp dist/cv-maker/index.html dist/cv-maker/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/cv-maker'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
