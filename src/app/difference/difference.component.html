<section class="cta-section">
  <div class="container">
    <div class="section-header text-center">
      <h2 class="section-title">Ready to Stand Out?</h2>
      <p class="section-subtitle">With CV Maker, your professional resume is always within reach. Stand out from the crowd and land more interviews.</p>
    </div>
    <div class="row g-4 justify-content-center">
      <div *ngFor="let item of differenceData" class="col-lg-4 col-md-6">
        <div class="cta-card">
          <h4 class="cta-card-title">{{item.title}}</h4>
          <ul class="cta-list">
            <li *ngFor="let diffs of item.diff">{{diffs.text}}</li>
          </ul>
        </div>
      </div>
    </div>
    <div class="cta-bottom text-center mt-5">
      <a routerLink="/genrateCv" class="btn btn-primary btn-lg cta-main-btn">Get Started for Free</a>
      <a routerLink="/resume-checker" class="btn btn-outline-primary btn-lg cta-secondary-btn ml-3">Check Your Existing Resume</a>
    </div>
  </div>
</section>
